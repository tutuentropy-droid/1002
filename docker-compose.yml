version: '3.8'

services:
  web:
    build: .
    container_name: zhui-ju-zhui-shu
    ports:
      - "${PORT:-8080}:88"
    environment:
      - VITE_DEBUG_MODE=${DEBUG_MODE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
